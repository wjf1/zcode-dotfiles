name: acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    name: acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 显示工具版本
        run: |
          chezmoi --version
          python3 --version || python --version

      - name: 验收矩阵（R0–R5 / T2.x）
        run: sh tests/acceptance.sh

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 gitleaks
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            # 资源名随版本变化（8.x 用 linux_x64），故从 release API 动态解析，避免写死失效
            url=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                  | grep -o 'https://[^"]*linux_x64\.tar\.gz' | head -1)
            echo "gitleaks asset: $url"
            curl -fsSL -o /tmp/gitleaks.tar.gz "$url"
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          fi
          gitleaks version

      - name: 扫描工作区与全量历史
        run: |
          # 8.19+ 推荐 dir/git 子命令，更老版本用 detect；按实际可用子命令选择，不掩盖失败
          if gitleaks help dir >/dev/null 2>&1; then
            gitleaks dir --redact --verbose .
            gitleaks git --redact --verbose .
          else
            gitleaks detect --source . --no-git --redact --verbose
            gitleaks detect --source . --redact --verbose
          fi
